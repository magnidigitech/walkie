<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Antenna -->
  <rect x="180" y="50" width="28" height="120" rx="14" fill="#64748b"/>
  <circle cx="194" cy="50" r="16" fill="#10b981"/>
  <!-- Walkie Body -->
  <rect x="130" y="140" width="252" height="320" rx="40" fill="#334155" stroke="#475569" stroke-width="8"/>
  <!-- Screen/Speaker Grill -->
  <rect x="160" y="175" width="192" height="95" rx="16" fill="#0f172a"/>
  <!-- Speaker lines / wave -->
  <line x1="185" y1="205" x2="327" y2="205" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <line x1="205" y1="222" x2="307" y2="222" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <line x1="225" y1="240" x2="287" y2="240" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <!-- PTT Button accent on body -->
  <circle cx="256" cy="355" r="50" fill="url(#grad)"/>
  <!-- Radio wave arcs -->
  <path d="M 236 340 A 25 25 0 0 1 236 370" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M 276 340 A 25 25 0 0 0 276 370" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="355" r="9" fill="#ffffff"/>
</svg>
