port: 7880
bind_addresses:
  - ""

# RTC media configuration
rtc:
  tcp_port: 7881
  udp_port: 7882
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  node_ip: "187.127.159.200"

# API keys for server-to-server and token generation
# These match LIVEKIT_API_KEY and LIVEKIT_API_SECRET in your .env
keys:
  talk_api_key_walkie: "secret_livekit_key_at_least_32_characters_long_prod"

# Built-in TURN server for clients behind strict firewalls and mobile carrier NATs
turn:
  enabled: true
  domain: "rtc.magnidigitech.com"
  tls_port: 5349
  udp_port: 3478
  external_tls: true
  relay_range_start: 50000
  relay_range_end: 60000

logging:
  json: false
  level: info
